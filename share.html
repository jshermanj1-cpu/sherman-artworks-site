.msg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:.95rem;cursor:pointer;min-height:44px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#f1ece3}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-size:.95rem;line-height:1.35;margin:0}
.price{font-size:.95rem;color:var(--gold-ink);margin:0;margin-top:auto}
.price s{color:var(--muted);font-size:.85em}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;font:inherit;font-size:.95rem;border-radius:8px;padding:10px 12px;min-height:44px;cursor:pointer;border:1px solid transparent}
.send{background:var(--wa);color:var(--wa-ink)}
.row{display:flex;gap:6px}
.ghost{background:none;border-color:var(--line);color:var(--ink)}
.row .btn{flex:1;font-size:.9rem;padding:8px}
.btn.done{border-color:var(--wa);color:var(--wa)}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
footer{color:var(--muted);font-size:.85rem;margin:28px 0 10px;border-top:1px solid var(--line);padding-top:14px}

var TEXT = {"he":{"title":"שליחת קישורים ללקוחות","intro":"מוצאים את הפריט, לוחצים על \"שליחה בוואטסאפ\", בוחרים את הלקוח ושולחים. הלקוח יקבל את התמונה עם קישור לדף שבו אפשר להזמין.","tip":"כדאי לשמור את הדף במסך הבית: בתפריט הדפדפן בוחרים \"הוספה למסך הבית\".","ready":"הודעות מוכנות","products":"פריטים","search":"חיפוש לפי שם או צבע","all":"הכל","send":"שליחה בוואטסאפ","copy":"העתקה","copied":"הועתק","view":"צפייה","from":"החל מ-","none":"לא נמצא פריט. נסו מילה אחרת.","sale":"יש מבצע באתר עכשיו, והמחירים כאן כבר אחרי ההנחה.","collection":"שליחת כל הקולקציה","copy_link":"העתקת קישור לדף","footer":"המחירים והפריטים מתעדכנים יחד עם האתר. קישורים שנשלחים מהדף הזה מסומנים, כדי שהסטודיו יוכל לראות אילו הזמנות הגיעו דרכם.","other":"English","m_shop":"כל האתר","m_order":"איך מזמינים","m_custom":"הזמנה אישית","msg_product":"שלום! הנה {name} של שרמן ארט וורקס 👇\n{url}\nבקישור יש תמונות, מידות ומחיר, ואפשר להזמין ישירות באתר. משלוח בישראל ₪35 (לחו\"ל $45), או איסוף עצמי מהגלריה בקרני שומרון.","msg_collection":"שלום! כאן אפשר לראות את כל קולקציית {name} של שרמן ארט וורקס 👇\n{url}\nבכל פריט יש תמונות ומחיר, ואפשר להזמין ישירות באתר.","msg_shop":"שלום! כל העבודות של שרמן ארט וורקס נמצאות עכשיו באתר, עם תמונות ומחירים, ואפשר להזמין ישירות 👇\n{url}","msg_order":"איך מזמינים? בוחרים פריט באתר, מוסיפים לעגלה ומשלמים בכרטיס אשראי, או שולחים את ההזמנה בוואטסאפ ישירות מהעגלה. משלוח בישראל ₪35 (לחו\"ל $45), או איסוף עצמי מהגלריה בקרני שומרון.\n{url}","msg_custom":"לעבודה בהזמנה אישית אפשר לספר לסטודיו כאן מה חשוב לכם, ויחזרו אליכם עם הצעה 👇\n{url}"},"en":{"title":"Send links to clients","intro":"Find the piece, tap \"Send on WhatsApp\", pick the client and send. They get the photo with a link to a page where they can order.","tip":"Tip: save this page to your home screen. In the browser menu, choose \"Add to Home screen\".","ready":"Ready messages","products":"pieces","search":"Search by name or color","all":"All","send":"Send on WhatsApp","copy":"Copy","copied":"Copied","view":"View","from":"From ","none":"Nothing found. Try another word.","sale":"There is a sale on the site right now, and the prices here already include it.","collection":"Send the whole collection","copy_link":"Copy link to page","footer":"Prices and pieces update with the site. Links sent from this page are tagged so the studio can see which orders came through them.","other":"עברית","m_shop":"The whole shop","m_order":"How to order","m_custom":"Custom piece","msg_product":"Hi! Here's a link to the {name} from Sherman Art Works:\n{url}\nThe link has the photos, sizes and price, and you can order right there on the site. Shipping is ₪35 in Israel and $45 abroad, or you can pick it up at the gallery in Karnei Shomron.","msg_collection":"Hi! Here's the whole {name} collection from Sherman Art Works:\n{url}\nEvery piece has photos and a price, and you can order right on the site.","msg_shop":"Hi! All of Sherman Art Works' pieces are on the website now, with photos and prices, and you can order right there:\n{url}","msg_order":"How to order: pick a piece on the site, add it to the cart and pay by card, or send the order on WhatsApp straight from the cart. Shipping is ₪35 in Israel and $45 abroad, or you can pick it up at the gallery in Karnei Shomron.\n{url}","msg_custom":"For a custom piece, tell the studio what you have in mind here and they'll get back to you with a quote:\n{url}"}};
var READY = [["m_shop","msg_shop",""],["m_order","msg_order",""],["m_custom","msg_custom","custom-orders.html"]];
var BASE = "https://shermanartworks.com", REF = "share";

// Copied from js/site.js by _share_page.py, so the sale is the site's own.
const LAUNCH_DISCOUNT = 0;
const HANUKKAH_SALE_START = Date.parse('2026-10-12T00:00:00+03:00');
const HANUKKAH_SALE_END = Date.parse('2026-12-05T00:00:00+02:00');
const SHOPPINGIL_SALE_START = Date.parse('2026-11-03T00:00:00+02:00');
const SHOPPINGIL_SALE_END = Date.parse('2026-11-12T00:00:00+02:00');
const SHOPPINGIL_DISCOUNT = 0.10;
function hanukkahSaleActive(now) {
  var at = now === undefined ? Date.now() : now;
  return at >= HANUKKAH_SALE_START && at < HANUKKAH_SALE_END;
}
function isHanukkahMenorah(slug) {
  return /^(silver|gold)-tone-(pearl-white|blue|clear|emerald-green|light-blue|terracotta|turquoise|white-blue)-(half-moon|rectangular|trapezoid)-menorah$/.test(slug || '');
}
function shoppingilSaleActive(now) {
  var at = now === undefined ? Date.now() : now;
  return at >= SHOPPINGIL_SALE_START && at < SHOPPINGIL_SALE_END;
}
function productDiscount(slug, now) {
  if (isHanukkahMenorah(slug) && hanukkahSaleActive(now)) return 0.20;
  if (String(slug || '').indexOf('quote:') !== 0 && shoppingilSaleActive(now)) return SHOPPINGIL_DISCOUNT;
  return LAUNCH_DISCOUNT;
}

var lang = 'he', cat = '', query = '';
try { lang = localStorage.getItem('sa_lang') === 'en' ? 'en' : 'he'; } catch (e) {}

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function root(l) { return BASE + (l === 'he' ? '/he/' : '/'); }
function link(rel) { return root(lang) + rel + '?ref=' + REF; }
function view(rel) { return root(lang) + rel; }
function fill(tpl, name, url) { return tpl.replace('{name}', name).replace('{url}', url); }
function wa(msg) { return 'https://wa.me/?text=' + encodeURIComponent(msg); }
function nis(n) { return '\u20aa' + Number(n).toLocaleString('en-IL'); }

function price(p) {
  var t = TEXT[lang], d = productDiscount(p.id);
  var reg = p.ils, now = d > 0 ? Math.round(reg * (1 - d)) : reg;
  var usd = d > 0 ? Math.round(p.usd * (1 - d)) : p.usd;
  // Sale price first, struck regular price after it, so the two read in the
  // same order in Hebrew and English.
  var main = (p.multi ? t.from : '') + nis(now) + (now !== reg ? ' <s>' + nis(reg) + '</s>' : '');
  return lang === 'en' ? main + ' / $' + usd : main;
}

// A product gets Send, then Copy and View under it; a ready message (no page of
// its own) gets Send and Copy on one line, so the products start higher up.
function buttons(msg, rel) {
  var t = TEXT[lang];
  var send = '<a class="btn send" href="' + esc(wa(msg)) + '" target="_blank" rel="noopener">' + esc(t.send) + '</a>';
  var copyBtn = '<button type="button" class="btn ghost" data-copy="' + esc(msg) + '">' + esc(t.copy) + '</button>';
  if (!rel) return '<div class="pair">' + send + copyBtn + '</div>';
  return send + '<div class="row">' + copyBtn +
    '<a class="btn ghost" href="' + esc(view(rel)) + '" target="_blank" rel="noopener">' + esc(t.view) + '</a></div>';
}

function render() {
  var t = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.title = t.title + ' | Sherman Art Works';
  ['title', 'intro', 'tip', 'ready', 'footer', 'other'].forEach(function (k) { $('t-' + k).textContent = t[k]; });
  $('search').placeholder = t.search;
  $('search').setAttribute('aria-label', t.search);
  $('sale').hidden = !DATA.some(function (p) { return productDiscount(p.id) > 0; });
  $('sale').textContent = t.sale;

  $('ready').innerHTML = READY.map(function (r) {
    return '<div class="msg"><strong>' + esc(t[r[0]]) + '</strong>' + buttons(fill(t[r[1]], '', link(r[2]))) + '</div>';
  }).join('');

  $('chips').innerHTML = [['', t.all]].concat(CATS.map(function (c) { return [c.id, c[lang]]; })).map(function (c) {
    return '<button type="button" class="chip" data-cat="' + c[0] + '" aria-pressed="' + (c[0] === cat) + '">' + esc(c[1]) + '</button>';
  }).join('');
  list();
}

function list() {
  var t = TEXT[lang], q = query.trim().toLowerCase();
  var shown = DATA.filter(function (p) {
    return (!cat || p.c === cat) && (!q || (p.he + ' ' + p.en).toLowerCase().indexOf(q) !== -1);
  });
  var c = CATS.filter(function (x) { return x.id === cat; })[0];
  $('count').textContent = shown.length + ' ' + t.products;
  $('collection').innerHTML = c ? buttonsCollection(c) : '';
  $('grid').innerHTML = shown.length ? shown.map(function (p) {
    var name = p[lang], rel = 'products/' + p.id + '.html';
    return '<article class="card"><img src="' + esc(p.img) + '" alt="' + esc(name) + '" loading="lazy" width="400" height="400">' +
      '<div class="body"><p class="name">' + esc(name) + '</p><p class="price">' + price(p) + '</p>' +
      buttons(fill(t.msg_product, name, link(rel)), rel) + '</div></article>';
  }).join('') : '<p class="empty">' + esc(t.none) + '</p>';
}

// The copy button takes the bare link (still tagged), for pasting into his own
// words rather than the ready message.
function buttonsCollection(c) {
  var t = TEXT[lang], msg = fill(t.msg_collection, c[lang], link(c.page));
  return '<span class="pair"><a class="btn send" href="' + esc(wa(msg)) + '" target="_blank" rel="noopener">' + esc(t.collection) + '</a>' +
    '<button type="button" class="btn ghost" data-copy="' + esc(link(c.page)) + '">' + esc(t.copy_link) + '</button></span>';
}

function copy(text, btn) {
  var label = btn.textContent;
  function done() {
    btn.textContent = TEXT[lang].copied + ' \u2713';
    btn.classList.add('done');
    setTimeout(function () { btn.textContent = label; btn.classList.remove('done'); }, 1800);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-copy]');
  if (b) { copy(b.getAttribute('data-copy'), b); return; }
  var c = e.target.closest('[data-cat]');
  if (c) { cat = c.getAttribute('data-cat'); render(); }
});
$('search').addEventListener('input', function () { query = this.value; list(); });
$('lang').addEventListener('click', function () {
  lang = lang === 'he' ? 'en' : 'he';
  try { localStorage.setItem('sa_lang', lang); } catch (e) {}
  render();
});
render();
</script>
